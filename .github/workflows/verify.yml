name: Verifica struttura e regressioni
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepara strumenti browser di test (nessuna dipendenza applicativa)
        run: npm install --prefix "$RUNNER_TEMP/accounting-browser" --no-audit --no-fund --package-lock=false playwright-core@1.62.1
      - name: Verifica completa del motore e dei flussi applicativi
        env:
          NODE_PATH: ${{ runner.temp }}/accounting-browser/node_modules
        run: bash scripts/verify-accounting.sh
