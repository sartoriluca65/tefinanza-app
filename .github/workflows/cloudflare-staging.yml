name: Cloudflare private staging
on:
  push:
    branches: [cloudflare-staging-2026-11-06]
    paths: ['cloudflare-staging/**', '.github/workflows/cloudflare-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-private-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node cloudflare-staging/build.mjs
      - run: node cloudflare-staging/worker.test.mjs
  deploy:
    if: vars.CLOUDFLARE_STAGING_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node cloudflare-staging/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
